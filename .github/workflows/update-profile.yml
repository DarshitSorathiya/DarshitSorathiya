name: Update profile
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/render_stats.py", "scripts/theme.py"]
permissions:
  contents: write
concurrency:
  group: readme-writes
  cancel-in-progress: false
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Render banner / about / projects / activity
        env:
          # Optional: add a PAT as secret GH_PAT to also count private contributions
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python scripts/render_stats.py
      - name: Commit
        run: |
          git config user.name "profile-bot"
          git config user.email "profile-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: refresh profile stats"
          git pull --rebase
          git push
